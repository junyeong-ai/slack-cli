[package]
name = "slack-cli"
version = "0.19.2"
edition = "2024"
rust-version = "1.98.0"
authors = ["Slack CLI Contributors"]
description = "Fast Slack CLI with FTS5 cache and local search"
license = "MIT"
repository = "https://github.com/junyeong-ai/slack-cli"
homepage = "https://github.com/junyeong-ai/slack-cli"
keywords = ["slack", "cli", "api", "cache", "search"]
categories = ["command-line-utilities", "api-bindings"]
readme = "README.md"
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README.en.md",
    "/rust-toolchain.toml",
]

[lib]
name = "slack_cli"
path = "src/lib.rs"

[[bin]]
name = "slack-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt-multi-thread", "time", "sync", "fs", "net", "io-util", "process", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake", "rustls-tls-webpki-roots"], default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
governor = "0.10.4"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
secrecy = { version = "0.10.3", features = ["serde"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
rpassword = "7.5.4"
etcetera = "0.11.0"
open = "5.4.4"
tempfile = "3.27.0"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["test-util"] }
rstest = "0.27.0"
wiremock = "0.6.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
