rules:
  unpinned-uses:
    config:
      policies:
        # slsa-verifier checks the generator's workflow ref, so it must be a tag.
        slsa-framework/slsa-github-generator/*: ref-pin
  self-repository:
    # actionlint rejects the `$/` form; revisit when it accepts it.
    disable: true
  dependabot-cooldown:
    config:
      # The hold before an auto-merged update is picked up; zizmor's default
      # is seven days.
      days: 3
